<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy — игра в разработке</title>
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div class="nebula" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="stars2" aria-hidden="true"></div>
<div class="stars3" aria-hidden="true"></div>
<div class="asteroids" aria-hidden="true">
  <i class="ast" style="--s:70px; --x:18%; --y:14%; --dur:190s; --delay:-40s"></i>
  <i class="ast ast-b" style="--s:30px; --x:78%; --y:22%; --dur:170s; --delay:-90s"></i>
  <i class="ast ast-c" style="--s:52px; --x:55%; --y:80%; --dur:240s; --delay:-140s"></i>
</div>

<main class="portal-wrap">
  <section class="glass-panel panel-center">
    <span class="frame" aria-hidden="true"></span>
    <span class="sheen" aria-hidden="true"></span>
    <span class="edge edge-t" aria-hidden="true"></span>
    <span class="edge edge-b" aria-hidden="true"></span>

    <p class="eyebrow">Galaxy · Игровой модуль</p>
    <h1 class="portal-title title-sm">В РАЗРАБОТКЕ</h1>
    <p class="portal-sub">Здесь появится игра. Корабли, товары и слоты уже настроены в админке — осталось собрать двигатели.</p>
    <div class="status-row"><span class="pulse" aria-hidden="true"></span> Статус: сборка на орбите</div>

    <nav class="portal-menu">
      <a class="portal-card portal-card--admin" href="index.html">
        <span class="card-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">На главную</span>
          <span class="card-desc">Вернуться к меню входа</span>
        </span>
        <span class="card-cta">Открыть <span class="card-arrow" aria-hidden="true">→</span></span>
      </a>

      <a class="portal-card portal-card--admin" href="admin.html">
        <span class="card-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Открыть админку</span>
          <span class="card-desc">Настроить данные вселенной</span>
        </span>
        <span class="card-cta">Открыть <span class="card-arrow" aria-hidden="true">→</span></span>
      </a>
    </nav>
  </section>
</main>
</body>
</html>
