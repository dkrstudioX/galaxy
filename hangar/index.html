<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELIOS // 7 — орбитальная база</title>
<link rel="stylesheet" href="hangar.css?v=20261078">
</head>
<body>
<main class="app-shell">
  <div class="scanline"></div>
  <div class="station-backdrop" aria-hidden="true">
    <div class="bay-window">
      <span class="planet"></span>
      <span class="stars stars-near"></span>
      <span class="stars stars-far"></span>
    </div>
    <div class="bay-beam beam-left"></div>
    <div class="bay-beam beam-right"></div>
    <div class="bay-ceiling"></div>
    <div class="bay-floor"></div>
    <div class="runway-lights"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg aria-hidden="true" fill="none" height="23" viewBox="0 0 24 24" width="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path>
          <circle cx="12" cy="12" r="5"></circle>
          <path d="m8.5 8.5 7 7m0-7-7 7"></path>
        </svg>
      </span>
      <div>
        <strong>HELIOS // 7</strong>
        <span>ОРБИТАЛЬНАЯ ЗВЁЗДНАЯ БАЗА</span>
      </div>
      <a class="map-link" href="../space/index.html" aria-label="Открыть карту Солнечной системы" title="Открыть карту Солнечной системы">
        <svg aria-hidden="true" fill="none" height="13" viewBox="0 0 24 24" width="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
          <path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path>
          <path d="M9 3v15M15 6v15"></path>
        </svg>
        <span class="map-link-label">Открыть карту</span>
      </a>
      <span class="build-badge" title="сборка 17.10.2026 · 20 изменений">v20 · 17.10</span>
    </div>
    <div class="station-status">
      <span class="pulse"></span>
      СИСТЕМЫ В НОРМЕ
      <span class="divider"></span>
      СЕКТОР A-17
    </div>
    <div class="balance" data-action="add-credits" title="Начислить 1 000 ¤" role="button" tabindex="0">
      <span>
        <svg aria-hidden="true" fill="none" height="17" viewBox="0 0 24 24" width="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M15 9.5c-.6-1-1.5-1.5-3-1.5-2 0-3 1-3 2.2 0 3.1 6 1 6 4 0 1.2-1 2.3-3 2.3-1.5 0-2.6-.5-3.2-1.5M12 6v2m0 8.5V19"></path>
        </svg>
      </span>
      <div>
        <small>Баланс</small>
        <strong id="creditsValue"></strong>
      </div>
    </div>
  </header>

  <div class="content">
    <section class="shop-view" id="view-shop">
      <div class="section-title section-title-status">
        <div class="terminal-status"><span></span> <span id="noticeShop">Торговый терминал подключён</span></div>
      </div>

      <div class="category-tabs" id="categoryTabs"></div>

      <div class="subcategory-bar" id="subcategoryBar">
        <span class="subcategory-title" id="subcategoryTitle" hidden>Подкатегории</span>
        <div class="subcategory-tabs" id="subcategoryTabs" hidden></div>
      </div>

      <div class="market-grid" id="marketGrid">
        <div class="inventory-panel" id="shipPanel">
          <div class="ship-panel-body" id="shipInfo"></div>
        </div>

        <div class="inventory-panel">
          <div class="item-list" id="shopList"></div>
        </div>

        <div class="inventory-panel" id="cargoPanel">
          <div class="item-list" id="cargoList"></div>
        </div>

        <div class="inventory-panel shop-panel">
          <div class="ship-panel-body shop-panel-body" id="shopConsole"></div>
        </div>
      </div>
    </section>

    <div id="shipDock"></div>
  </div>
</main>
<div class="slot-tip" id="slotTip" hidden></div>
<div class="slot-modal" id="slotModal" hidden></div>
<script src="../data/store.js?v=20261073"></script>
<script src="../data/icons.js?v=20261017"></script>
<script src="hangar.js?v=20261073"></script>
</body>
</html>
