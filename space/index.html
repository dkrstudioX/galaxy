<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solar System - Realistic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="ui" class="glass">
    <div class="hud-title">SOL SYSTEM</div>
    BASE: <b>LUNA-ORBIT</b><br>
    ZOOM: <b id="z">1.0x</b><br>
    SPEED: <b id="speed">1x</b><br>
    DATE: <b id="date">—</b><br>
    TIME: +<b id="days">0.0000</b> d
</div>

<div id="controls">
    <button class="btn" id="slowBtn">Медленнее</button>
    <button class="btn active" id="normalBtn">Нормально</button>
    <button class="btn" id="fastBtn">Быстрее</button>
</div>

<div id="sidePanel">
    <div class="panel-block glass" id="mapBlock">
        <div class="panel-head" title="Свернуть / развернуть">
            <div><span>01</span><strong>Солнечная система</strong></div>
            <small>PLANETS</small>
            <span class="caret">▼</span>
        </div>
        <div class="panel-body">
            <ul class="tree" id="lootTree"></ul>
        </div>
    </div>

    <div class="panel-block glass hidden" id="objectBlock">
        <div class="panel-head" title="Свернуть / развернуть">
            <div><span>02</span><strong id="objectName">Объект</strong></div>
            <small>SELECTION</small>
            <span class="caret">▼</span>
        </div>
        <div class="panel-body" id="objectInfo">
            <div class="obj-empty">Кликните по солнцу, планете, луне или базе на карте</div>
        </div>
    </div>

    <div class="panel-block glass" id="smallBlock">
        <div class="panel-head" title="Свернуть / развернуть">
            <div><span>03</span><strong>Малые тела</strong></div>
            <small>SMALL BODIES</small>
            <span class="caret">▼</span>
        </div>
        <div class="panel-body">
            <div class="sb-list" id="smallList"></div>
            <div class="sb-fact">Орбиты метеоритов Innisfree, Lost City, Příbram прослежены до пояса</div>
        </div>
    </div>
</div>

<!-- Корень модальных окон: диалоги подтверждения (как #modal-root в админке). -->
<div id="modal-root"></div>

<canvas id="c"></canvas>
<script>
// Диагностика загрузки: ловим ошибки скриптов до того, как сработает app.js.
// В проде безвреден: просто копит список в window.__bootErrs.
window.__bootErrs = [];
window.addEventListener('error', e => window.__bootErrs.push(e.filename + ':' + e.lineno + ' ' + e.message));
window.addEventListener('unhandledrejection', e => window.__bootErrs.push('promise: ' + e.reason));
</script>
<!-- Общие данные проекта (как в админке и ангаре): объекты, категории,
     купленные корабли. Только чтение; при отсутствии Store панель базы
     покажет заметку. Классические скрипты — работают и с file://. -->
<script src="../data/store.js?v=20261017"></script>
<script src="../data/icons.js?v=20261017"></script>
<!-- app.js = сборка js/*.js (py build.py), без модулей — чтобы страница открывалась напрямую с file:// -->
<script src="app.js?v=20261033"></script>
</body>
</html>
